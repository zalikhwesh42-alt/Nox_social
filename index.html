
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>NOX — Réseau social</title>

<style>
*{box-sizing:border-box}
:root{--bg:#080808;--panel:#141414;--field:#1c1c1c;--white:#fff;--gray:#999;--border:#333}
body{margin:0;background:var(--bg);color:white;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.signup{width:100%;max-width:470px;margin:auto;padding:25px 22px 40px}
.logo{text-align:center;font-size:37px;font-weight:900;letter-spacing:7px;margin:10px 0 30px}
.intro{text-align:center;margin-bottom:27px}
.intro h1{font-size:28px;margin:0 0 10px}
.intro p{color:var(--gray);font-size:14px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
.field input,.field select{width:100%;height:51px;background:var(--field);border:1px solid var(--border);border-radius:9px;padding:0 13px;color:white;outline:none}
.field input:focus,.field select:focus{border-color:white}
.field input::placeholder{color:#777}
.phone{display:flex;gap:8px}
.phone select{width:112px;flex-shrink:0}
.phone input{flex:1;min-width:0}
.password{position:relative}
.password input{padding-right:55px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:white;font-size:18px}
.terms{display:flex;gap:10px;color:#aaa;font-size:12px;line-height:1.5;margin:20px 0}
.terms input{margin-top:3px;accent-color:white}
.primary{width:100%;height:53px;border:0;border-radius:9px;background:white;color:black;font-weight:800}
.separator{display:flex;align-items:center;gap:12px;color:#777;font-size:12px;margin:23px 0}
.separator:before,.separator:after{content:"";height:1px;background:#333;flex:1}
.google,.secondary{width:100%;height:51px;border:1px solid #444;background:transparent;color:white;border-radius:9px;margin-bottom:10px}
.login{text-align:center;color:#999;font-size:13px;margin-top:24px}
.login button{background:none;border:0;color:white;font-weight:bold}
.notice{display:none;background:#202020;border:1px solid #555;border-radius:9px;padding:12px;margin-top:14px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.notice.show{display:block}
.small-link{display:block;text-align:center;color:#aaa;font-size:12px;margin:12px 0;text-decoration:underline;cursor:pointer}
.home{padding-bottom:80px}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #222;position:sticky;top:0;background:#080808;z-index:5}
.topbar .logo{font-size:25px;margin:0;letter-spacing:4px}
.top-actions{display:flex;gap:18px}
.top-actions button{background:none;border:0;color:white;font-size:21px}
.welcome{padding:18px 17px 12px;border-bottom:1px solid #222}
.welcome h2{font-size:20px;margin:0 0 5px}
.welcome p{font-size:13px;color:#999;margin:0}
.feed{height:calc(100dvh - 143px);min-height:450px;position:relative;background:#111;overflow:hidden}
.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#151515}
.video-shade{position:absolute;inset:0;background:linear-gradient(transparent 48%,rgba(0,0,0,.8));pointer-events:none}
.video-info{position:absolute;left:17px;right:80px;bottom:25px;z-index:2}
.creator{font-weight:bold;font-size:15px;margin-bottom:8px}
.caption{font-size:14px;line-height:1.4}
.sound{font-size:12px;color:#ddd;margin-top:9px}
.video-actions{position:absolute;right:15px;bottom:35px;display:flex;flex-direction:column;gap:21px;align-items:center;z-index:3}
.action{border:0;background:none;color:white;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;text-shadow:0 1px 4px #000}
.action small{font-size:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;padding-bottom:env(safe-area-inset-bottom);background:#090909;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav-button{background:none;border:0;color:#888;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:19px;min-width:55px}
.nav-button span{font-size:10px}
.nav-button.active{color:white}
.create-button{width:43px;height:30px;border-radius:9px;background:white;color:black;font-size:24px;display:grid;place-items:center;font-weight:bold}
.profile-screen,.other-screen{padding:22px 17px}
.profile-header{display:flex;align-items:center;gap:17px;margin:15px 0 20px}
.avatar{width:88px;height:88px;border-radius:50%;background:#292929;display:grid;place-items:center;font-size:30px;font-weight:bold;overflow:hidden}
.profile-data{flex:1}
.profile-data h2{font-size:18px;margin:0 0 12px}
.stats{display:flex;gap:17px;font-size:12px;color:#aaa}
.stats b{display:block;color:white;font-size:16px}
.edit-button{width:100%;height:43px;border:1px solid #444;color:white;background:#171717;border-radius:8px}
.profile-bio{font-size:13px;color:#aaa;margin:15px 0}
.other-screen h2{font-size:22px}
.other-screen p{color:#999;font-size:14px;line-height:1.6}
.logout{margin-top:25px;background:transparent;color:white;border:1px solid #444;padding:12px 18px;border-radius:8px}
#recaptcha-container{margin:12px 0}
@media(min-width:700px){.feed{max-width:430px;margin:auto;height:calc(100vh - 143px)}}
</style>
</head>

<body>

<section class="screen active" id="signupScreen">
<main class="signup">
<div class="logo">NOX</div>
<div class="intro">
<h1 id="formTitle">Rejoins NOX.</h1>
<p id="formSubtitle">Découvre les talents, partage tes vidéos<br>et fais entendre ta créativité.</p>
</div>

<form id="signupForm">
<div class="field" id="fullnameField">
<label for="fullname">Nom complet</label>
<input id="fullname" type="text" placeholder="Ex. Jean Dupont" autocomplete="name">
</div>

<div class="field" id="usernameField">
<label for="username">Nom d'utilisateur</label>
<input id="username" type="text" placeholder="Ex. jean_creatif" minlength="3" maxlength="24">
</div>

<div class="field" id="emailField">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" placeholder="exemple@email.com" autocomplete="email">
</div>

<div class="field" id="phoneField">
<label for="phone">Téléphone</label>
<div class="phone">
<select id="country">
<option value="+243">🇨🇩 +243</option>
<option value="+242">🇨🇬 +242</option>
<option value="+225">🇨🇮 +225</option>
<option value="+237">🇨🇲 +237</option>
<option value="+221">🇸🇳 +221</option>
<option value="+33">🇫🇷 +33</option>
<option value="+1">🇺🇸 +1</option>
</select>
<input id="phone" type="tel" placeholder="Numéro de téléphone" autocomplete="tel">
</div>
</div>

<div class="field" id="passwordField">
<label for="password">Mot de passe</label>
<div class="password">
<input id="password" type="password" placeholder="Minimum 8 caractères" minlength="8">
<button class="eye" type="button" onclick="togglePassword('password',this)">◉</button>
</div>
</div>

<div class="field" id="confirmField">
<label for="confirm">Confirmer le mot de passe</label>
<div class="password">
<input id="confirm" type="password" placeholder="Confirme ton mot de passe">
<button class="eye" type="button" onclick="togglePassword('confirm',this)">◉</button>
</div>
</div>

<div class="field" id="codeField" style="display:none">
<label for="smsCode">Code reçu par SMS</label>
<input id="smsCode" type="text" inputmode="numeric" placeholder="Entre le code de vérification">
</div>

<label class="terms" id="termsField">
<input id="accept" type="checkbox">
<span>J'accepte les conditions d'utilisation et la politique de confidentialité de NOX.</span>
</label>

<button class="primary" id="submitButton" type="submit">Créer mon compte</button>
<div class="notice" id="signupNotice" role="status"></div>
</form>

<div id="recaptcha-container"></div>
<button class="secondary" id="phoneButton" type="button">Continuer avec mon téléphone (SMS)</button>
<button class="secondary" id="verifyButton" type="button" style="display:none">Vérifier le code SMS</button>

<div class="separator">OU</div>
<button class="google" id="googleButton" type="button">G &nbsp; Continuer avec Google</button>

<div class="login" id="loginLine">
Déjà membre ? <button type="button" id="loginToggle">Se connecter</button>
</div>
</main>
</section>

<section class="screen" id="homeScreen">
<header class="topbar">
<div class="logo">NOX</div>
<div class="top-actions">
<button onclick="openSection('Découvrir')">⌕</button>
<button onclick="openSection('Notifications')">♧</button>
</div>
</header>
<div class="welcome">
<h2 id="welcomeTitle">Bienvenue sur NOX !</h2>
<p>Découvre les vidéos et les talents de la communauté.</p>
</div>
<main id="homeContent">
<div class="feed">
<video class="video" autoplay muted loop playsinline>
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
</video>
<div class="video-shade"></div>
<div class="video-info">
<div class="creator" id="videoCreator">@createur_nox</div>
<div class="caption">Bienvenue dans l'univers NOX. Ici, chaque talent mérite d'être découvert.</div>
<div class="sound">♫ Son original — NOX</div>
</div>
<div class="video-actions">
<button class="action" onclick="likeVideo(this)">♡<small>J'aime</small></button>
<button class="action" onclick="alert('Les commentaires seront développés ensuite.')">▢<small>Commenter</small></button>
<button class="action" onclick="saveVideo(this)">☆<small>Favoris</small></button>
<button class="action" onclick="shareVideo()">↗<small>Partager</small></button>
</div>
</div>
</main>
<nav class="bottom-nav">
<button class="nav-button active" onclick="openSection('Accueil',this)">⌂<span>Accueil</span></button>
<button class="nav-button" onclick="openSection('Découvrir',this)">⌕<span>Découvrir</span></button>
<button class="nav-button" onclick="openSection('Créer',this)"><div class="create-button">+</div><span>Créer</span></button>
<button class="nav-button" onclick="openSection('Messages',this)">✉<span>Messages</span></button>
<button class="nav-button" onclick="openSection('Profil',this)">◉<span>Profil</span></button>
</nav>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,
 RecaptchaVerifier,signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

/* Configuration du projet Firebase NOX */
const firebaseConfig={
 apiKey:"AIzaSyARZ4HrJUnBKGlSDit7e_YckQ9_0LcLWiE",
 authDomain:"nox-ap.firebaseapp.com",
 projectId:"nox-ap",
 storageBucket:"nox-ap.firebasestorage.app",
 messagingSenderId:"732367763101",
 appId:"1:732367763101:web:a7eed493c6d1ec413c8674"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const googleProvider=new GoogleAuthProvider();

let confirmationResult=null;
let recaptchaVerifier=null;
let loginMode=false;
let phoneMode=false;

const $=id=>document.getElementById(id);

function notice(message){
 const box=$("signupNotice");
 box.textContent=message;
 box.classList.add("show");
}
function clearNotice(){
 $("signupNotice").textContent="";
 $("signupNotice").classList.remove("show");
}
function getPhone(){
 const number=$("phone").value.replace(/\D/g,"");
 return $("country").value+number;
}
function validProfile(){
 const fullname=$("fullname").value.trim();
 const username=$("username").value.trim();
 if(!fullname)return "Entre ton nom complet.";
 if(!/^[a-zA-Z0-9_]{3,24}$/.test(username))
 return "Nom d'utilisateur invalide : 3 à 24 lettres, chiffres ou underscores.";
 if(!$("accept").checked)return "Tu dois accepter les conditions d'utilisation.";
 return "";
}
async function saveProfile(user,extra={}){
 const profile={
  uid:user.uid,
  fullname:extra.fullname||user.displayName||user.email||"Utilisateur NOX",
  username:extra.username||user.displayName?.replace(/\s+/g,"_").toLowerCase()||"nox_"+user.uid.slice(0,7),
  email:user.email||null,
  phone:user.phoneNumber||null,
  photoURL:user.photoURL||null,
  updatedAt:serverTimestamp()
 };
 await setDoc(doc(db,"users",user.uid),profile,{merge:true});
}
function showHome(user){
 $("signupScreen").classList.remove("active");
 $("homeScreen").classList.add("active");
 const name=user.displayName||user.email||user.phoneNumber||"Utilisateur";
 $("welcomeTitle").textContent="Bienvenue, "+name+" !";
 $("videoCreator").textContent="@"+(user.displayName||"createur_nox").replace(/\s+/g,"_").toLowerCase();
 window.scrollTo(0,0);
}
function showSignup(){
 $("homeScreen").classList.remove("active");
 $("signupScreen").classList.add("active");
}
onAuthStateChanged(auth,user=>{
 if(user)showHome(user);
 else showSignup();
});

window.togglePassword=(id,button)=>{
 const input=$(id);
 input.type=input.type==="password"?"text":"password";
 button.textContent=input.type==="password"?"◉":"◎";
};

$("signupForm").addEventListener("submit",async e=>{
 e.preventDefault();
 clearNotice();
 if(phoneMode){
  notice("Pour l'inscription par SMS, demande d'abord ton code avec le bouton téléphone.");
  return;
 }
 if(loginMode){
  try{
   const email=$("email").value.trim();
   const password=$("password").value;
   if(!email||!password)return notice("Entre ton adresse e-mail et ton mot de passe.");
   await signInWithEmailAndPassword(auth,email,password);
  }catch(error){notice(firebaseError(error));}
  return;
 }
 const profileError=validProfile();
 if(profileError)return notice(profileError);
 const email=$("email").value.trim();
 const password=$("password").value;
 if(!email)return notice("Entre ton adresse e-mail.");
 if(password.length<8)return notice("Le mot de passe doit contenir au moins 8 caractères.");
 if(password!==$("confirm").value)return notice("Les deux mots de passe ne correspondent pas.");
 try{
  const credential=await createUserWithEmailAndPassword(auth,email,password);
  await saveProfile(credential.user,{
   fullname:$("fullname").value.trim(),
   username:$("username").value.trim()
  });
 }catch(error){notice(firebaseError(error));}
});

$("googleButton").addEventListener("click",async()=>{
 clearNotice();
 try{
  const result=await signInWithPopup(auth,googleProvider);
  await saveProfile(result.user);
 }catch(error){notice(firebaseError(error));}
});

$("phoneButton").addEventListener("click",async()=>{
 clearNotice();
 if(loginMode){notice("Pour le moment, la connexion par téléphone utilise le même processus de vérification SMS.");}
 if(!loginMode){
  const profileError=validProfile();
  if(profileError)return notice(profileError);
 }
 const digits=$("phone").value.replace(/\D/g,"");
 if(digits.length<6)return notice("Entre un numéro de téléphone valide.");
 try{
  if(!recaptchaVerifier){
   recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
  }
  await recaptchaVerifier.render();
  confirmationResult=await signInWithPhoneNumber(auth,getPhone(),recaptchaVerifier);
  $("codeField").style.display="block";
  $("phoneButton").style.display="none";
  $("verifyButton").style.display="block";
  notice("Code SMS demandé. Entre le code reçu sur ton téléphone.");
 }catch(error){
  if(recaptchaVerifier){try{await recaptchaVerifier.clear();}catch(e){} recaptchaVerifier=null;}
  notice(firebaseError(error));
 }
});

$("verifyButton").addEventListener("click",async()=>{
 clearNotice();
 const code=$("smsCode").value.trim();
 if(!code)return notice("Entre le code reçu par SMS.");
 if(!confirmationResult)return notice("Demande d'abord un code SMS.");
 try{
  const result=await confirmationResult.confirm(code);
  await saveProfile(result.user,{
   fullname:$("fullname").value.trim()||result.user.phoneNumber,
   username:$("username").value.trim()||"nox_"+result.user.uid.slice(0,7)
  });
 }catch(error){notice(firebaseError(error));}
});

$("loginToggle").addEventListener("click",()=>{
 loginMode=!loginMode;
 phoneMode=false;
 clearNotice();
 $("formTitle").textContent=loginMode?"Bon retour sur NOX.":"Rejoins NOX.";
 $("formSubtitle").textContent=loginMode?"Connecte-toi pour retrouver ta communauté.":"Découvre les talents, partage tes vidéos et fais entendre ta créativité.";
 $("fullnameField").style.display=loginMode?"none":"block";
 $("usernameField").style.display=loginMode?"none":"block";
 $("confirmField").style.display=loginMode?"none":"block";
 $("termsField").style.display=loginMode?"none":"flex";
 $("submitButton").textContent=loginMode?"Se connecter":"Créer mon compte";
 $("loginLine").innerHTML=loginMode?'Nouveau sur NOX ? <button type="button" id="loginToggle">Créer un compte</button>':'Déjà membre ? <button type="button" id="loginToggle">Se connecter</button>';
 $("loginToggle").addEventListener("click",()=>location.reload());
});

function firebaseError(error){
 const messages={
  "auth/email-already-in-use":"Cette adresse e-mail possède déjà un compte.",
  "auth/invalid-email":"Adresse e-mail invalide.",
  "auth/weak-password":"Mot de passe trop faible.",
  "auth/invalid-credential":"Adresse e-mail ou mot de passe incorrect.",
  "auth/popup-closed-by-user":"La fenêtre Google a été fermée.",
  "auth/popup-blocked":"Le navigateur a bloqué la fenêtre Google.",
  "auth/unauthorized-domain":"Ce domaine n'est pas autorisé dans Firebase Authentication.",
  "auth/operation-not-allowed":"Cette méthode de connexion n'est pas activée dans Firebase.",
  "auth/too-many-requests":"Trop de tentatives. Réessaie plus tard.",
  "auth/invalid-phone-number":"Numéro de téléphone invalide.",
  "auth/quota-exceeded":"Quota SMS dépassé. Vérifie la facturation Firebase.",
  "auth/captcha-check-failed":"La vérification reCAPTCHA a échoué. Réessaie."
 };
 return messages[error.code]||("Erreur Firebase : "+error.message);
}

window.openSection=(name,button)=>{
 const content=$("homeContent");
 document.querySelectorAll(".nav-button").forEach(b=>b.classList.remove("active"));
 if(button)button.classList.add("active");
 if(name==="Accueil"){
  content.innerHTML=`
  <div class="feed">
  <video class="video" autoplay muted loop playsinline>
  <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
  </video><div class="video-shade"></div>
  <div class="video-info"><div class="creator">@createur_nox</div>
  <div class="caption">Bienvenue dans l'univers NOX. Ici, chaque talent mérite d'être découvert.</div>
  <div class="sound">♫ Son original — NOX</div></div>
  <div class="video-actions">
  <button class="action" onclick="likeVideo(this)">♡<small>J'aime</small></button>
  <button class="action" onclick="alert('Commentaires à développer.')">▢<small>Commenter</small></button>
  <button class="action" onclick="saveVideo(this)">☆<small>Favoris</small></button>
  <button class="action" onclick="shareVideo()">↗<small>Partager</small></button>
  </div></div>`;
  return;
 }
 if(name==="Profil"){
  const user=auth.currentUser;
  content.innerHTML=`
  <div class="profile-screen">
  <div class="profile-header">
  <div class="avatar">${(user?.displayName||user?.email||"N").charAt(0).toUpperCase()}</div>
  <div class="profile-data">
  <h2>${escapeHTML(user?.displayName||"Utilisateur NOX")}</h2>
  <div style="color:#999;font-size:13px">${escapeHTML(user?.email||user?.phoneNumber||"")}</div>
  <div class="stats"><div><b>0</b>Abonnés</div><div><b>0</b>Abonnements</div><div><b>0</b>J'aime</div></div>
  </div></div>
  <button class="edit-button" onclick="alert('Modification du profil à développer.')">Modifier le profil</button>
  <div class="profile-bio">Bienvenue sur mon profil NOX.</div>
  <p style="text-align:center;color:#777;margin-top:55px">Tes vidéos apparaîtront ici.</p>
  <button class="logout" onclick="logout()">Se déconnecter</button>
  </div>`;
  return;
 }
 const descriptions={
  "Découvrir":"Découvre les créateurs et les vidéos populaires sur NOX.",
  "Créer":"La création et la publication de vidéos seront développées ici.",
  "Messages":"Tes conversations apparaîtront ici.",
  "Notifications":"Tes notifications apparaîtront ici."
 };
 content.innerHTML=`<div class="other-screen"><h2>${name}</h2><p>${descriptions[name]||""}</p></div>`;
};
window.escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
window.likeVideo=button=>{
 const liked=button.dataset.liked==="true";
 button.dataset.liked=String(!liked);
 button.firstChild.textContent=liked?"♡":"♥";
};
window.saveVideo=button=>{
 const saved=button.dataset.saved==="true";
 button.dataset.saved=String(!saved);
 button.firstChild.textContent=saved?"☆":"★";
};
window.shareVideo=()=>{
 if(navigator.share)navigator.share({title:"NOX",text:"Découvre NOX !"}).catch(()=>{});
 else alert("Le partage n'est pas disponible sur ce navigateur.");
};
window.logout=async()=>{
 try{await signOut(auth);}catch(error){alert(firebaseError(error));}
};
</script>
</body>
</html>
